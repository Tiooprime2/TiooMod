name: Build TiooMod

# Otomatis compile setiap kali ada push ke main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Bisa juga trigger manual dari tab Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Ambil code dari repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Cache Gradle biar compile lebih cepat next time
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Kasih permission ke gradlew
      - name: Grant execute permission
        run: chmod +x gradlew

      # 5. Compile!
      - name: Build with Gradle
        run: ./gradlew build

      # 6. Simpan hasil .jar buat di-download
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: TiooMod-1.0.0
          path: build/libs/TiooMod-*.jar
          retention-days: 30
